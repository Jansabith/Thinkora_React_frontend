<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/thinkora%20image.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Thinkora: learn, practise and grow with courses, practice questions and teacher support." />
    <title>Thinkora · Learn, Practice, Grow</title>
    <!-- Fonts: Plus Jakarta Sans (interface) and Caveat (handwritten quotes). Without internet, system fonts are used. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved light/dark theme before React starts, so the page never flashes the wrong colours.
      (function () {
        try {
          var saved = localStorage.getItem('lms_theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = saved === 'dark' || ((saved === null || saved === 'system') && prefersDark);
          document.documentElement.dataset.theme = isDark ? 'dark' : 'light';
        } catch (error) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
